# sentinel.yaml — drop this file in your project root and run `sentinel init`
# Docs: https://github.com/VishalVinayRam/Project-KEMM

namespace: my-team   # used to isolate resources in multi-tenant deployments

git_provider:
  provider: github        # github | gitlab
  token: ${GITHUB_TOKEN}
  repo: my-org/my-repo
  webhook_secret: ${GITHUB_WEBHOOK_SECRET}

  # For self-hosted GitLab:
  # provider: gitlab
  # base_url: https://gitlab.mycompany.com/api/v4

cloud_provider:
  provider: floci         # floci (local) | aws | gcp
  region: us-east-1
  endpoint: http://localhost:4566   # only needed for floci

  # For real AWS (remove endpoint line above):
  # provider: aws
  # region: us-east-1

  # For GCP:
  # provider: gcp
  # project_id: my-gcp-project

llm:
  provider: kserve        # kserve | openai | anthropic
  endpoint: http://localhost:8080
  model: phi-3-lite

  # For OpenAI:
  # provider: openai
  # model: gpt-4o-mini
  # api_key: ${OPENAI_API_KEY}

  # For Anthropic:
  # provider: anthropic
  # model: claude-haiku-4-5-20251001
  # api_key: ${ANTHROPIC_API_KEY}

rag:
  enabled: true
  index_paths:
    - src/
    - docs/
    - README.md
  exclude:
    - node_modules/
    - .git/
    - __pycache__/
    - "*.lock"
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5

pr_agent:
  enabled: true
  block_on:
    - critical
    - high
  max_diff_lines: 500

incident:
  alert_sources:
    - cloudwatch         # cloudwatch | loki | prometheus
  signal_threshold: 2    # how many failing signals = real incident
  auto_remediate: false
  notification:
    - slack

alerting:
  provider: slack
  webhook_url: ${SLACK_WEBHOOK_URL}

# ── External observability stack (optional) ───────────────────────────────────
# Sentinel runs on AWS but can connect to Grafana / Mimir / Loki hosted
# anywhere — GCP, on-prem, Grafana Cloud, etc. All connections are HTTPS.
#
observability:

  # Loki — Sentinel forwards confirmed incidents back to Loki as structured
  # log entries, and the loki-bridge Lambda receives Loki alert webhooks.
  loki:
    url: ${LOKI_URL}                  # e.g. https://loki.company.com:3100
    # username: ${LOKI_USERNAME}      # Grafana Cloud Loki auth
    # password: ${LOKI_PASSWORD}
    # tenant_id: my-team              # X-Scope-OrgID for multi-tenant Loki

  # Mimir — Prometheus remote_writes sentinel_* metrics here so they land
  # in your existing long-term metrics store alongside app metrics.
  mimir:
    url: ${MIMIR_REMOTE_WRITE_URL}    # e.g. https://mimir.company.com/api/v1/push
    # username: ${MIMIR_USERNAME}     # Grafana Cloud Mimir auth
    # password: ${MIMIR_PASSWORD}
    metric_prefix: sentinel           # only push metrics matching this prefix

  # Grafana — run `sentinel grafana push` to import the Sentinel dashboard
  # into your existing Grafana instance without touching its other dashboards.
  grafana:
    url: ${GRAFANA_URL}               # e.g. https://grafana.company.com
    api_key: ${GRAFANA_API_KEY}       # Grafana service account token
    folder: Sentinel                  # folder to create / update
