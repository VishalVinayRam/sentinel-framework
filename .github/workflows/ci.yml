name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: pip install flake8 isort

      - name: flake8
        run: flake8 sentinel/ services/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E221,E501,E272,E127,E128,E129,E131

      - name: isort
        run: isort --check-only sentinel/ services/ tests/

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install responses httpx

      - name: Run unit tests
        env:
          SENTINEL_API_KEY: ci-test-key
          SENTINEL_ENV: development
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest tests/ -v --tb=short \
            --cov=sentinel --cov=services/dashboard \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
