prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Remote-write to an external Mimir (or any Prometheus-compatible store).
    # Works regardless of where Mimir is hosted — GCP, on-prem, Grafana Cloud.
    # Leave the list empty ([]) to disable.
    remoteWrite:
      - url: "${MIMIR_REMOTE_WRITE_URL}"           # e.g. https://mimir.company.com/api/v1/push
        # Grafana Cloud / Mimir basic auth (omit block if Mimir is open)
        basicAuth:
          username: "${MIMIR_USERNAME}"
          password: "${MIMIR_PASSWORD}"
        # Only ship sentinel_* metrics to Mimir; keep infra noise local
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "sentinel_.*"
            action: keep
        # Backoff / queue tuning so Lambda-spiky writes don't drop
        queueConfig:
          capacity: 2500
          maxSamplesPerSend: 500
          batchSendDeadline: 5s

    additionalScrapeConfigs:
      - job_name: sentinel-lambdas
        static_configs:
          - targets: ["localhost:9090"]
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance

      - job_name: kserve-inference
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["ml-ops-lite"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: kserve-container
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: sentinel-kinesis
        static_configs:
          - targets: ["localhost:4566"]
        metrics_path: /_aws/metrics

    additionalAlertManagerConfigs:
      - scheme: http
        static_configs:
          - targets: ["alertmanager:9093"]

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "sentinel-slack"
      routes:
        - match:
            severity: P1
          receiver: "sentinel-pagerduty"
          continue: true
        - match:
            severity: P2
          receiver: "sentinel-slack"
    receivers:
      - name: "sentinel-slack"
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL}"
            channel: "#incidents"
            title: "[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"
            text: "{{ .CommonAnnotations.description }}"
      - name: "sentinel-pagerduty"
        pagerduty_configs:
          - routing_key: "${PAGERDUTY_ROUTING_KEY}"
            description: "{{ .CommonAnnotations.summary }}"

grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: sentinel
          orgId: 1
          folder: Sentinel
          type: file
          options:
            path: /var/lib/grafana/dashboards/sentinel
  dashboardsConfigMaps:
    sentinel: sentinel-grafana-dashboards
