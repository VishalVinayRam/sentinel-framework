global:
  resolve_timeout: 5m

route:
  group_by: [service, severity]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: sentinel-webhook
  routes:
    - match:
        severity: critical
      receiver: sentinel-webhook
      continue: true
    - match:
        severity: warning
      receiver: sentinel-webhook

receivers:
  - name: sentinel-webhook
    webhook_configs:
      # Sentinel's local alert receiver (started by connect_sentinel.sh)
      - url: "http://host.docker.internal:8502/alertmanager/webhook"
        send_resolved: true
        http_config:
          follow_redirects: true
