[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-framework"
version = "0.1.0"
description = "AI-powered incident response framework — plug into any cloud, any git provider, any LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vishal Vinay Ram", email = "vishalvinayram5432@gmail.com" }]
keywords = ["incident-response", "mlops", "devops", "ai", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "click>=8.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
gcp = ["google-cloud-pubsub", "google-cloud-firestore", "google-cloud-storage", "google-cloud-secret-manager"]
openai = ["openai>=1.0"]
rag = ["psycopg2-binary>=2.9", "pgvector>=0.2"]
dev = ["pytest>=7.4", "pytest-mock>=3.12", "ruff>=0.1"]
all = ["sentinel-framework[gcp,openai,rag,dev]"]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/VishalVinayRam/Project-KEMM"
Issues = "https://github.com/VishalVinayRam/Project-KEMM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
